# BUILD = `docker compose build`
# RUN = `docker compose run --rm ms-tissue-seg`

services:
  ms-tissue-seg:
    image: ghcr.io/jakepalmer/ms-tissue-seg:dev
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./data:/home/data"
      - "./ms_tissue_seg:/home/ms_tissue_seg"
      - "./run_pipeline.py:/home/run_pipeline.py"
      - "./.python-version:/home/.python-version"
    command: sh -c "cd /home && uv run python run_pipeline.py"