[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-tissue-seg"
version = "0.1.0"
description = "MS lesion segmentation."
authors = [
    {name = "Jake Palmer"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dcm2bids>=3.2.0",
    "loguru>=0.7.3",
    "pycdlib>=1.14.0",
    "ruff>=0.13.1",
    "templateflow>=25.0.3",
    "antspyx>=0.6.1",
    "antspynet>=0.3.1",
    "dcm2niix>=1.0.20250506",
    "tensorflow-cpu>=2.12,<2.16",
]

[project.urls]
Homepage = "https://github.com/jakepalmer/ms-tissue-seg"
Repository = "https://github.com/jakepalmer/ms-tissue-seg"

[tool.setuptools.packages.find]
where = ["."]
include = ["ms_tissue_seg*"]
